name: ELF Matching check

on:
  push:
    branches:
      - master
  pull_request_target:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-push:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Cloning
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download KH2FM's elf
        env:
          KH2FM_ELF_URL: ${{ secrets.KH2FM_ELF_URL }}
        run: |
          curl -L --fail --output SLPM_666.75 "$KH2FM_ELF_URL"

      - name: Compiles and verify whether the build is matching
        run: make verify

  verify-pr:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    environment: kh2-verify

    steps:
      - name: Cloning
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ github.token }}
          lfs: true

      - name: Download KH2FM's elf
        env:
          KH2FM_ELF_URL_PR: ${{ secrets.KH2FM_ELF_URL_PR }}
        run: |
          curl -L --fail --output SLPM_666.75 "$KH2FM_ELF_URL_PR"

      - name: Compiles and verify whether the build is matching
        run: make verify
